<body>
  <main id="game" aria-label="ساحة معارك كبيرة">
    <canvas id="scene" aria-label="اسحب يمينًا أو يسارًا لتحريك الجيش"></canvas>
    <div id="hud" hidden>
      <div class="army-meter"><svg viewBox="0 0 36 30" aria-hidden="true"><circle cx="18" cy="7" r="5"/><circle cx="6" cy="11" r="4"/><circle cx="30" cy="11" r="4"/><path d="M11 29V20a7 7 0 0 1 14 0v9M0 29V22a6 6 0 0 1 10-4v11M26 29V18a6 6 0 0 1 10 4v7"/></svg><strong id="army-count">6</strong></div>
      <div class="stage-meter"><span id="stage-label">المرحلة ١</span><div class="progress-track"><i id="progress"></i></div></div>
      <div id="base-meter" class="pill base-pill" hidden title="قلوب القلعة"><i aria-hidden="true">♥</i><b id="base-hp">10</b></div>
      <button id="pause" aria-label="إيقاف مؤقت">Ⅱ</button>
    </div>
    <div id="boss-ui" hidden><span>عملاق الحصن</span><div><i id="boss-health"></i></div></div>
    <div id="gate-feedback" aria-live="polite"></div>
    <div id="army-tag" class="world-tag" hidden aria-hidden="true"><b>6</b></div>
    <div id="horde-tag" class="world-tag" hidden aria-hidden="true"><b>0</b></div>
    <div id="giant-tag" class="world-tag" hidden aria-hidden="true"><b>0</b><span><i></i></span></div>
    <div id="start" class="screen">
      <div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><h1><span>BIG</span> BATTLES</h1><p class="arabic-name">معارك كبيرة</p><p class="tagline" dir="ltr">SMALL HEROES · BIG BATTLES</p></div>
      <div class="start-prompt"><p id="load-status">جارٍ التجهيز</p><div id="load-line"><i></i></div><span>أبطال صغار • معارك كبيرة</span><button id="preview-soldier" type="button" aria-haspopup="dialog">معاينة الجندي <small>مؤقت</small></button>
        <div id="defense-menu" hidden><div class="coin-line"><i class="coin" aria-hidden="true"></i><b id="menu-coins">0</b></div><div id="stage-picker" role="group" aria-label="اختر المرحلة"></div><button id="open-upgrades" type="button">⚒ التطويرات</button></div></div>
    </div>
    <section id="soldier-preview" role="dialog" aria-modal="true" aria-labelledby="preview-title" hidden>
      <div class="preview-top"><div><h2 id="preview-title">الجندي</h2><p>المجسم الحالي في اللعبة</p></div><button id="preview-back" type="button">عودة</button></div>
      <p id="preview-status" role="status"></p>
      <p class="preview-hint">اسحب لتدوير المجسم</p>
    </section>
    <div id="result" class="screen result-screen" hidden><div class="result-mark">✦</div><h2 id="result-title">انتصار</h2><p id="result-note"></p><p id="result-coins" hidden><i class="coin" aria-hidden="true"></i><b></b></p><button id="next-stage" type="button" hidden>المرحلة التالية</button><button id="replay">إعادة</button><button id="result-upgrades" type="button" hidden>⚒ التطويرات</button></div>
    <section id="upgrades" class="screen" role="dialog" aria-modal="true" aria-labelledby="upgrades-title" hidden><div class="upgrades-top"><h2 id="upgrades-title">التطويرات</h2><div class="coin-line"><i class="coin" aria-hidden="true"></i><b id="upgrade-coins">0</b></div></div><div id="upgrade-list"></div><button id="close-upgrades" type="button">تم</button></section>
    <div id="breach-flash" aria-hidden="true"></div>
    <div id="barrel-tags" aria-hidden="true"></div>
    <div id="float-layer" aria-hidden="true"></div>
    <div id="banner" aria-live="polite"><b></b><small></small></div>
    <div id="confetti" aria-hidden="true"></div>
    <div id="paused" class="screen pause-screen" hidden><h2>توقف مؤقت</h2><p>المس للمتابعة</p></div>
    <pre id="debug" hidden dir="ltr"></pre>
